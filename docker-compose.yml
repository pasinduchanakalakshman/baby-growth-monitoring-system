

services:
  gateway:
    build:
      context: ./gateway
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
    depends_on:
      - child-growth-monitoring-service
    networks:
      - app-network

  child-growth-monitoring-service:
    build:
      context: ./services/child-growth-monitoring-service
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
    networks:
      - app-network

  research:
    build:
      context: ./research-environment
    volumes:
      - ./data:/workspace/data
      - ./research:/workspace/research
      - ./models:/workspace/models
      - ./docs:/workspace/docs
    working_dir: /workspace

networks:
  app-network:
    driver: bridge
